spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reelz}
    username: ${DATABASE_USERNAME:reelz}
    password: ${DATABASE_PASSWORD:reelz}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId:%X{requestId:-}] %logger{36} - %msg%n"

reelz:
  account:
    public-url: ${PUBLIC_APP_URL:http://localhost}
    mail-mode: ${ACCOUNT_MAIL_MODE:LOG}
    mail-from: ${MAIL_FROM:no-reply@cinegiro.app}
    verification-ttl: ${EMAIL_VERIFICATION_TTL:PT24H}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
    request-cooldown: ${ACCOUNT_TOKEN_COOLDOWN:PT1M}
  admin:
    emails: ${ADMIN_EMAILS:}
  analytics:
    retention-days: ${ANALYTICS_RETENTION_DAYS:180}
    cleanup-cron: ${ANALYTICS_CLEANUP_CRON:0 30 3 * * *}
  billing:
    abacatepay:
      enabled: ${ABACATEPAY_ENABLED:false}
      api-key: ${ABACATEPAY_API_KEY:}
      webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
      webhook-hmac-key: ${ABACATEPAY_WEBHOOK_HMAC_KEY:}
      monthly-product-id: ${ABACATEPAY_MONTHLY_PRODUCT_ID:}
      annual-product-id: ${ABACATEPAY_ANNUAL_PRODUCT_ID:}
      monthly-price-cents: ${REELZ_PREMIUM_MONTHLY_PRICE_CENTS:1290}
      annual-price-cents: ${REELZ_PREMIUM_ANNUAL_PRICE_CENTS:9990}
      public-app-url: ${PUBLIC_APP_URL:http://localhost}
      methods: ${ABACATEPAY_METHODS:CARD}
      accept-dev-events: ${ABACATEPAY_ACCEPT_DEV_EVENTS:false}
      connect-timeout: ${ABACATEPAY_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${ABACATEPAY_READ_TIMEOUT:PT15S}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:reelz-api}
      expiration: ${JWT_EXPIRATION:PT2H}
  legal:
    terms-version: ${TERMS_VERSION:1.0}
    privacy-version: ${PRIVACY_VERSION:1.0}
  roulette:
    catalog-source: ${ROULETTE_CATALOG_SOURCE:ALL}
  tmdb:
    read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    language: ${TMDB_LANGUAGE:pt-BR}
    region: ${TMDB_REGION:BR}
    pages-per-provider: ${TMDB_PAGES_PER_PROVIDER:${TMDB_IMPORT_PAGES:3}}
    max-providers: ${TMDB_MAX_PROVIDERS:10}
    provider-ids: ${TMDB_PROVIDER_IDS:8,119,350,337,531,1899,307,283,11,300}
    sync-on-startup: ${TMDB_SYNC_ON_STARTUP:false}
    scheduled-sync-enabled: ${TMDB_SCHEDULED_SYNC_ENABLED:false}
    sync-cron: ${TMDB_SYNC_CRON:0 0 4 * * *}
    sync-zone: ${TMDB_SYNC_ZONE:America/Sao_Paulo}
    lease-duration: ${TMDB_SYNC_LEASE_DURATION:PT30M}
    max-attempts: ${TMDB_MAX_ATTEMPTS:3}
    retry-base-delay: ${TMDB_RETRY_BASE_DELAY:PT0.25S}
    connect-timeout: ${TMDB_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${TMDB_READ_TIMEOUT:PT15S}
  streaming-availability:
    enabled: ${STREAMING_AVAILABILITY_ENABLED:false}
    api-key: ${STREAMING_AVAILABILITY_API_KEY:}
    base-url: ${STREAMING_AVAILABILITY_BASE_URL:https://api.movieofthenight.com/v4}
    country: ${STREAMING_AVAILABILITY_COUNTRY:BR}
    output-language: ${STREAMING_AVAILABILITY_OUTPUT_LANGUAGE:en}
    catalogs: ${STREAMING_AVAILABILITY_CATALOGS:netflix.subscription,prime.subscription,disney.subscription,hbo.subscription,apple.subscription,paramount.subscription,mubi.subscription,curiosity.subscription,plutotv.free,crunchyroll.subscription}
    bootstrap-pages-per-run: ${STREAMING_AVAILABILITY_BOOTSTRAP_PAGES_PER_RUN:20}
    changes-pages-per-run: ${STREAMING_AVAILABILITY_CHANGES_PAGES_PER_RUN:10}
    deactivate-unconfigured-providers: ${STREAMING_AVAILABILITY_DEACTIVATE_UNCONFIGURED_PROVIDERS:false}
    sync-on-startup: ${STREAMING_AVAILABILITY_SYNC_ON_STARTUP:false}
    scheduled-sync-enabled: ${STREAMING_AVAILABILITY_SCHEDULED_SYNC_ENABLED:false}
    sync-cron: ${STREAMING_AVAILABILITY_SYNC_CRON:0 0 4 * * *}
    sync-zone: ${STREAMING_AVAILABILITY_SYNC_ZONE:America/Sao_Paulo}
    lease-duration: ${STREAMING_AVAILABILITY_SYNC_LEASE_DURATION:PT30M}
    max-attempts: ${STREAMING_AVAILABILITY_MAX_ATTEMPTS:3}
    retry-base-delay: ${STREAMING_AVAILABILITY_RETRY_BASE_DELAY:PT0.25S}
    connect-timeout: ${STREAMING_AVAILABILITY_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${STREAMING_AVAILABILITY_READ_TIMEOUT:PT20S}
