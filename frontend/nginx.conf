# Protege os dois endpoints públicos contra abuso básico durante o beta.
limit_req_zone $binary_remote_addr zone=reelz_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reelz_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=reelz_account_recovery:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    limit_req_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/nginx/reelz-security-headers.conf;

    location = /api/v1/auth/login {
        limit_req zone=reelz_login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/users {
        limit_req zone=reelz_register burst=2 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/auth/(email-verification|password-reset)/request$ {
        limit_req zone=reelz_account_recovery burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Mantém frontend e API na mesma origem. O URI /api/... é preservado.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Assets com hash podem ser armazenados em cache por um ano.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/reelz-security-headers.conf;
    }

    # O navegador deve sempre revalidar o service worker para detectar deploys.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/reelz-security-headers.conf;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/reelz-security-headers.conf;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/reelz-security-headers.conf;
    }

    # Fallback necessário para rotas do React Router, como /library.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/reelz-security-headers.conf;
    }
}
