name: reelz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reelz}
      POSTGRES_USER: ${POSTGRES_USER:-reelz}
      # Obrigatória: o Compose falha cedo se a senha não estiver no arquivo .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - reelz_internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-reelz}
      DATABASE_USERNAME: ${POSTGRES_USER:-reelz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      # Deve ser Base64 de pelo menos 32 bytes aleatórios; nunca use o exemplo em produção.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_ISSUER: ${JWT_ISSUER:-reelz-api}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT2H}
      TERMS_VERSION: ${TERMS_VERSION:-1.0}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-1.0}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      TMDB_REGION: ${TMDB_REGION:-BR}
      TMDB_PAGES_PER_PROVIDER: ${TMDB_PAGES_PER_PROVIDER:-3}
      TMDB_MAX_PROVIDERS: ${TMDB_MAX_PROVIDERS:-10}
      TMDB_PROVIDER_IDS: ${TMDB_PROVIDER_IDS:-8,119,350,337,531,1899,307,283,11,300}
      TMDB_SYNC_ON_STARTUP: ${TMDB_SYNC_ON_STARTUP:-false}
      TMDB_SCHEDULED_SYNC_ENABLED: ${TMDB_SCHEDULED_SYNC_ENABLED:-false}
      TMDB_SYNC_CRON: ${TMDB_SYNC_CRON:-0 0 4 * * *}
      TMDB_SYNC_ZONE: ${TMDB_SYNC_ZONE:-America/Sao_Paulo}
      TMDB_SYNC_LEASE_DURATION: ${TMDB_SYNC_LEASE_DURATION:-PT30M}
      TMDB_MAX_ATTEMPTS: ${TMDB_MAX_ATTEMPTS:-3}
      TMDB_RETRY_BASE_DELAY: ${TMDB_RETRY_BASE_DELAY:-PT0.25S}
      TMDB_CONNECT_TIMEOUT: ${TMDB_CONNECT_TIMEOUT:-PT5S}
      TMDB_READ_TIMEOUT: ${TMDB_READ_TIMEOUT:-PT15S}
    depends_on:
      db:
        condition: service_healthy
    # Disponível localmente para diagnóstico, mas não exposto em todas as interfaces.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - reelz_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio usa o proxy /api do Nginx e evita configuração de CORS.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - reelz_internal

volumes:
  postgres_data:

networks:
  reelz_internal:
    driver: bridge
