groups:
  - name: reelz-beta
    rules:
      - alert: ReelzBackendDown
        expr: up{job="reelz-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend do Reelz indisponivel"
          description: "O Prometheus nao coleta o backend ha pelo menos 2 minutos."
      - alert: ReelzHighServerErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa elevada de erros 5xx"
          description: "Mais de 5% das requisicoes resultaram em 5xx nos ultimos 5 minutos."
      - alert: ReelzSlowRoulette
        expr: histogram_quantile(0.95, sum by (le) (rate(reelz_roulette_spin_duration_seconds_bucket[10m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Roleta lenta no percentil 95"
          description: "O processamento de um giro superou 2 segundos no p95."
      - alert: ReelzDatabasePoolSaturated
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pool de conexoes proximo do limite"
          description: "Mais de 85% das conexoes do pool estao em uso."
